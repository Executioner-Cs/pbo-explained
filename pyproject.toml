[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pbo-explained"
version = "0.1.0"
description = "Reproducible implementations and calibration studies for backtest-overfitting statistics"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
]
figure = [
    "matplotlib>=3.11,<4",   # paper figures only (experiments/build_paper_figures.py)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
